name: Fehlerbericht
description: Reproduzierbares Problem in UI, API oder Datenpipeline melden
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Beschreibung
      description: Was ist passiert und was wurde erwartet?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Bereich
      options: [Frontend, API, Airflow, dbt, Datenqualität, Infrastruktur, Dokumentation]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduktion
      description: Schritte mit ausschließlich synthetischen Daten
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Umgebung
      description: Betriebssystem, Browser oder Container-Versionen
  - type: checkboxes
    id: privacy
    attributes:
      label: Datenschutz
      options:
        - label: Der Bericht enthält keine echten Gesundheitsdaten oder Geheimnisse.
          required: true
