name: fitdata-coach

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fitdata:${POSTGRES_PASSWORD:-fitdata}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    FITDATA_DATABASE_URL: postgresql+psycopg://fitdata:${POSTGRES_PASSWORD:-fitdata}@postgres:5432/fitdata
    FITDATA_MINIO_ENDPOINT: minio:9000
    FITDATA_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
    FITDATA_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./pipeline:/opt/airflow/pipeline:ro
    - ./data/sample:/opt/airflow/sample:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  web:
    build: .
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    environment:
      FITDATA_DATABASE_URL: postgresql+asyncpg://fitdata:${POSTGRES_PASSWORD:-fitdata}@postgres:5432/fitdata
      FITDATA_MINIO_ENDPOINT: minio:9000
      FITDATA_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      FITDATA_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 4s
      retries: 8

  api-seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.seed"]
    env_file: .env
    environment:
      FITDATA_DATABASE_URL: postgresql+asyncpg://fitdata:${POSTGRES_PASSWORD:-fitdata}@postgres:5432/fitdata
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@fitdata-coach.de}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-FitData-Demo-2026!}
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fitdata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitdata}
      POSTGRES_DB: fitdata
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitdata -d fitdata"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/fitdata-raw &&
        mc mb --ignore-existing local/fitdata-quarantine
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      minio:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    command: airflow db migrate
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: airflow api-server
    ports: ["8080:8080"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.latest
    working_dir: /usr/app
    entrypoint: ["/bin/sh", "-c"]
    command: ["dbt deps --profiles-dir . && dbt build --profiles-dir ."]
    volumes: ["./dbt:/usr/app:ro"]
    environment:
      DBT_HOST: postgres
      DBT_USER: fitdata
      DBT_PASSWORD: ${POSTGRES_PASSWORD:-fitdata}
      DBT_DATABASE: fitdata
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["transform"]

volumes:
  postgres-data:
  minio-data:
  airflow-logs:
