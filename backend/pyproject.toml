[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fitdata-coach-api"
version = "0.1.0"
description = "Serving API and domain logic for FitData Coach"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "email-validator>=2.2,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "minio>=7.2,<8",
]

[project.optional-dependencies]
data = ["pandas>=2.2,<3", "pandera>=0.24,<1"]
test = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "httpx>=0.28,<1", "coverage>=7.10,<8"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"
